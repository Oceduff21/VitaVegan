services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitavegan
      POSTGRES_PASSWORD: vitavegan
      POSTGRES_DB: vitavegan
    ports:
      - "5432:5432"
    volumes:
      - vitavegan_pg:/var/lib/postgresql/data

volumes:
  vitavegan_pg:
